# GitHub Pages + scheduled refresh of NBA scores and lines (data/ only).
name: refresh-stoopids-hoops
on:
  schedule:
    # GitHub delayed the previous */10 schedule on this public repo to ~40-75 min (median ~53).
    # */5 is the tightest first-party cadence GitHub accepts (~288 proposed runs/day, still one
    # ESPN read and a commit only when data/ changed). No external ping or Grok routine.
    # No new token: the repo GITHUB_TOKEN (contents: write) is enough.
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/refresh_nba.py --merge
      - run: |
          git config user.name stoopids-bot
          git config user.email bot@users.noreply.github.com
          git add data/ assets/teams.js
          git diff --cached --quiet || (git commit -m "refresh" && git pull --rebase -X theirs origin main && git push)
